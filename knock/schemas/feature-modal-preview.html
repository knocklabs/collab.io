<style>
  .feature-modal-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Inter, sans-serif;
  }

  .feature-modal {
    background: white;
    border: 1px solid #dfe2e5;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    width: 480px;
    max-width: 100%;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    position: relative;
  }

  .feature-modal .dismiss-button {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }

  .feature-modal .dismiss-button:hover {
    background: rgba(0, 0, 0, 0.6);
  }

  .feature-modal .image-section {
    background: #efece7;
    height: 200px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .feature-modal .image-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .feature-modal .content-section {
    padding: 16px 20px;
  }

  .feature-modal .title {
    font-size: 18px;
    font-weight: 500;
    line-height: 28px;
    color: #1c2024;
    margin: 0 0 8px 0;
  }

  .feature-modal .body {
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
    color: #60646a;
    letter-spacing: 0.0275px;
    margin: 0;
  }

  .feature-modal .body p {
    margin: 0;
  }

  .feature-modal .button-group {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: flex-end;
    padding: 0 20px 16px 20px;
  }

  .feature-modal .button {
    flex: 1;
    height: 36px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    line-height: 20px;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .feature-modal .button-primary {
    background: #1d2023;
    color: #fcfcfd;
  }

  .feature-modal .button-primary:hover {
    background: #2c3034;
  }

  .feature-modal .button-secondary {
    background: white;
    color: #1d2023;
    border: 1px solid #d7dadf;
  }

  .feature-modal .button-secondary:hover {
    background: #f9fafb;
  }
</style>

<div class="feature-modal-overlay">
  <div class="feature-modal">
    <button class="dismiss-button">&times;</button>

    {% if image.url != blank %}
    <div class="image-section">
      <img src="{{ image.url }}" alt="{{ image.alt }}" />
    </div>
    {% endif %}

    <div class="content-section">
      <h3 class="title">{{ title }}</h3>
      <div class="body">
        <p>{{ body }}</p>
      </div>
    </div>

    <div class="button-group">
      <button class="button button-primary">{{ primary_button.text }}</button>
      <button class="button button-secondary">{{ secondary_button.text }}</button>
    </div>
  </div>
</div>
